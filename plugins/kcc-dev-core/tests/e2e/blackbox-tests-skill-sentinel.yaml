# L3 activation case for kcc-dev-core's blackbox-tests skill — the one
# skill that both writes the cases and materializes them into runnable
# test code.
#
# Proves the chain: the project install registers the skill,
# the slash invocation expands the skill, and the skill's body (carrying
# the version sentinel) reaches the model's context.
#
# Deliberately uses deterministic slash invocation, NOT natural-language
# routing: the deleted kcc-testing sentinel case proved model-routed
# activation is unreliable under `claude -p` + Haiku (stable red).
# Tool lockout (borrowed from kcc-core's principles-injected.yaml)
# removes every out-of-band path to the sentinel — the model cannot grep
# SKILL.md; the only source is the expanded skill content in context.

name: "kcc-dev-core.blackbox-tests skill expands and its sentinel reaches context"
prompt: "/kcc-dev-core.blackbox-tests Sanity check only — do not write any cases, do not materialize anything, do not call any tools. In the skill instructions above there is an HTML comment starting with kcc-dev-core-blackbox-tests-sentinel. Quote that sentinel string verbatim, then stop. If you cannot find it, reply NO_SENTINEL_IN_SKILL."
maxBudgetUsd: 0.05
timeoutMs: 180000

disallowedTools:
  - Read
  - Glob
  - Grep
  - Bash
  - Write
  - Edit
  - WebFetch
  - WebSearch
  - Task

expect:
  exitCode: 0
  parsedJson:
    type: "result"
    subtype: "success"
    is_error: false
  stdout:
    contains:
      - "kcc-dev-core-blackbox-tests-sentinel: v"
    notContains:
      - "NO_SENTINEL_IN_SKILL"
      - "kcc-dev-core-unit-tests-sentinel"
