name: plugin tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly full run (incl. L3/L4) — adjust as needed.
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      run_e2e:
        description: "Run L3/L4 layers (needs ANTHROPIC_API_KEY secret)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: L1 + L2 (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install npm deps
        run: npm ci || npm install

      - name: Install bats-core
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
        continue-on-error: true

      - name: Run L1 (schema + official validate)
        run: npm run test:l1

      - name: Run L2 (unit)
        run: npm run test:l2

      # The installer is the only thing between this repo and a user's
      # project, so exercise it for real: install, prove it is idempotent,
      # prove --check passes, prove --check catches an edit, and prove
      # uninstall leaves nothing behind.
      - name: Installer round-trip
        run: |
          set -euo pipefail
          target="$(mktemp -d)"
          git -C "$target" init -q
          node installer/install.mjs --target "$target" --all -y
          node installer/install.mjs --target "$target" --all -y | tee /tmp/second.log
          grep -q "already up to date" /tmp/second.log
          node installer/install.mjs --target "$target" --check
          echo "tampered" >> "$target/.claude/skills/kcc-dev-core:spec/SKILL.md"
          if node installer/install.mjs --target "$target" --check; then
            echo "--check failed to detect a local edit" >&2
            exit 1
          fi
          node installer/install.mjs --target "$target" --all -y
          node installer/install.mjs --target "$target" --check
          node installer/install.mjs --target "$target" --uninstall -y
          test ! -e "$target/.claude/skills"
          test ! -e "$target/.claude/kcc/kcc.lock.json"

      # Regression: a pre-existing file at a *pulled-in dependency's* path
      # must be a conflict. It once was not — the caller hashed only the
      # requested modules, so the dependency's paths looked absent and the
      # file was overwritten with no conflict and no backup.
      - name: Installer refuses to clobber a dependency's path
        run: |
          set -euo pipefail
          target="$(mktemp -d)"
          git -C "$target" init -q
          mkdir -p "$target/.claude/kcc/kcc-core/context"
          echo "someone else's file" > "$target/.claude/kcc/kcc-core/context/thinking-principles.md"
          if node installer/install.mjs --target "$target" --modules kcc-dev-core -y; then
            echo "installer clobbered a dependency path instead of reporting a conflict" >&2
            exit 1
          fi
          grep -q "someone else's file" "$target/.claude/kcc/kcc-core/context/thinking-principles.md"

  online:
    name: L3 + L4 (API-gated)
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_e2e == 'true')
    needs: offline
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install npm deps
        run: npm ci || npm install

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run L4 (load-time assertions)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run test:l4

      - name: Run L3 (e2e YAML cases)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run test:l3
