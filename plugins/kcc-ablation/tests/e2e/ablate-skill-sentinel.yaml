# L3 activation case for kcc-ablation's ablate skill.
#
# Proves the chain: `claude --plugin-dir <kcc-ablation>` loads the plugin,
# the slash invocation expands the skill, and the skill's body (carrying
# the version sentinel) reaches the model's context.
#
# Deliberately uses deterministic slash invocation, NOT natural-language
# routing (see kcc-dev-core's skill-sentinel cases for why). Tool lockout
# removes every out-of-band path to the sentinel — the model cannot grep
# SKILL.md; the only source is the expanded skill content in context.

name: "kcc-ablation:ablate skill expands and its sentinel reaches context"
prompt: "/kcc-ablation:ablate Sanity check only — do not design or run any campaign, do not call any tools. In the skill instructions above there is an HTML comment starting with kcc-ablation-ablate-sentinel. Quote that sentinel string verbatim, then stop. If you cannot find it, reply NO_SENTINEL_IN_SKILL."
maxBudgetUsd: 0.05
timeoutMs: 180000

disallowedTools:
  - Read
  - Glob
  - Grep
  - Bash
  - Write
  - Edit
  - WebFetch
  - WebSearch
  - Task

expect:
  exitCode: 0
  parsedJson:
    type: "result"
    subtype: "success"
    is_error: false
  stdout:
    contains:
      - "kcc-ablation-ablate-sentinel: v"
    notContains:
      - "NO_SENTINEL_IN_SKILL"
