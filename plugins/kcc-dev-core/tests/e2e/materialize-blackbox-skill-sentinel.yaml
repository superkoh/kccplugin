# L3 activation case for kcc-dev-core's materialize-blackbox-tests skill.
# Same design as write-blackbox-skill-sentinel.yaml: deterministic slash
# invocation + tool lockout; asserts this skill's sentinel appears and
# the sibling skill's does not (routing separation).

name: "kcc-dev-core:materialize-blackbox-tests skill expands and its sentinel reaches context"
prompt: "/kcc-dev-core:materialize-blackbox-tests Sanity check only — do not materialize anything, do not call any tools. In the skill instructions above there is an HTML comment starting with kcc-dev-core-materialize-blackbox-tests-sentinel. Quote that sentinel string verbatim, then stop. If you cannot find it, reply NO_SENTINEL_IN_SKILL."
maxBudgetUsd: 0.05
timeoutMs: 180000

disallowedTools:
  - Read
  - Glob
  - Grep
  - Bash
  - Write
  - Edit
  - WebFetch
  - WebSearch
  - Task

expect:
  exitCode: 0
  parsedJson:
    type: "result"
    subtype: "success"
    is_error: false
  stdout:
    contains:
      - "kcc-dev-core-materialize-blackbox-tests-sentinel: v"
    notContains:
      - "NO_SENTINEL_IN_SKILL"
      - "kcc-dev-core-write-blackbox-tests-sentinel"
